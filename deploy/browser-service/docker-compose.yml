# Garden Browser Service — co-located on the Choreograph EC2 host.
#
# Binds to 127.0.0.1 only so only the orchestrator (on localhost) can reach it.
# storageState files are read from host paths mounted via the /storage volume.
# Chromium only: the Camoufox engine was removed on 2026-10-13. A container
# created from an older version of this file (BROWSER_ENGINES naming camoufox)
# still starts, with Camoufox reported unavailable.
#
# Do NOT run this file directly on the developer workstation — it is a
# host-service config only (Phase 1 deployment target: Choreograph EC2).

services:
  browser-service:
    image: mcr.microsoft.com/playwright:v1.61.0-noble
    working_dir: /app
    command: ["node", "--experimental-vm-modules", "dist/browser-service/main.js"]
    environment:
      - BROWSER_SERVICE_HOST=0.0.0.0
      - BROWSER_SERVICE_PORT=7771
      - BROWSER_ENGINES=chromium
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    volumes:
      # Compiled JS output (rsync'd from CI/deploy)
      - /opt/choreograph/current/dist:/app/dist:ro
      # node_modules with playwright installed
      - /opt/choreograph/current/node_modules:/app/node_modules:ro
      # storageState files minted host-side from SSM-backed Cognito credentials.
      # The browser capability receives only /storage/hoja.json, never tokens.
      - /opt/choreograph/storage-states:/storage:ro
    ports:
      # Localhost-only — orchestrator reaches this on 127.0.0.1:7771
      - "127.0.0.1:7771:7771"
    restart: unless-stopped
    # chromium-headless-shell requires some Linux capabilities on Docker
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    shm_size: "256mb"
    # Resource limits: the Chromium pool.
    mem_limit: 3g
    mem_reservation: 512m

volumes: {}
