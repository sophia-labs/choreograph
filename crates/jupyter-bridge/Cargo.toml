[package]
name = "choreograph-jupyter-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
anyhow = "=1.0.100"
jupyter-protocol = "=2.0.2"
jupyter-zmq-client = { version = "=1.0.1", default-features = false, features = ["tokio-runtime", "ring"] }
nix = { version = "=0.30.1", features = ["signal"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["full"] }
uuid = { version = "=1.18.1", features = ["v4"] }

[dev-dependencies]
ring = "=0.17.14"
