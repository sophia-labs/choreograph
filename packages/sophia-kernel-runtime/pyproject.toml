[project]
name = "sophia-kernel-runtime"
version = "0.1.0"
description = "Sophia-owned kernel-side RLM control and harness surface"
requires-python = ">=3.10"
dependencies = [
  "dill==0.4.1",
  "httpx==0.28.1",
  "ipykernel==6.29.5",
  "mcp==2.0.0",
  "nest-asyncio==1.6.0",
  "tyro==1.0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm"]
